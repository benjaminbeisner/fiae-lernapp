{% extends "base.html" %}
{% block title %}Anmelden · FIAE-Lernapp{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Anmelden</h1>
  <form method="post">{% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Anmelden</button>
  </form>
  <p class="muted small" style="margin-top:16px">Noch kein Konto? Mit einem Einladungscode kannst du dich <a href="{% url 'registrieren' %}">hier registrieren</a>.</p>
</div>
{% endblock %}
